# Local development stack. PAPER-ONLY: no service receives wallet keys.
# Usage: cp .env.example .env && docker compose up --build
#
# Database users (least privilege, created on first DB start by infra/db/init-roles.sh):
#   migrate   -> owner (schema changes only)
#   api       -> autotrader_api    (SELECT only)
#   collector -> autotrader_worker (INSERT/UPDATE on market-data tables; no DELETE/DDL)
#   paper-trader -> autotrader_worker (INSERT on paper tables; the only writer of PAPER fills)
#   control   -> autotrader_control (INSERT paper_commands / audit_log / auth sessions only)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autotrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-autotrader}
      AUTOTRADER_API_DB_PASSWORD: ${AUTOTRADER_API_DB_PASSWORD:-api-local-only}
      AUTOTRADER_WORKER_DB_PASSWORD: ${AUTOTRADER_WORKER_DB_PASSWORD:-worker-local-only}
      AUTOTRADER_CONTROL_DB_PASSWORD: ${AUTOTRADER_CONTROL_DB_PASSWORD:-control-local-only}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./infra/db/roles.sql:/docker-entrypoint-initdb.d/roles.sql.in:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment: &backend_env
      AUTOTRADER_TRADING_MODE: PAPER
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-autotrader}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-autotrader}
      AUTOTRADER_MARKET_DEX: ${AUTOTRADER_MARKET_DEX:-xyz}
      AUTOTRADER_MARKET_COIN: ${AUTOTRADER_MARKET_COIN:-xyz:CL}
      AUTOTRADER_CORS_ORIGINS: http://localhost:3000
    command: ["alembic", "upgrade", "head"]
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment:
      <<: *backend_env
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://autotrader_api:${AUTOTRADER_API_DB_PASSWORD:-api-local-only}@db:5432/${POSTGRES_DB:-autotrader}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      # /health answers 503 when the database is down -> container reports unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: { migrate: { condition: service_completed_successfully } }

  collector:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment:
      <<: *backend_env
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://autotrader_worker:${AUTOTRADER_WORKER_DB_PASSWORD:-worker-local-only}@db:5432/${POSTGRES_DB:-autotrader}
    # Market discovery, REST backfill, live WS stream, gap fill, heartbeat.
    command: ["autotrader", "collect"]
    restart: unless-stopped
    # Shutdown waits for an in-flight REST sync to finish before releasing the
    # single-writer lock (review M4); bounded by HTTP timeouts.
    stop_grace_period: 90s
    depends_on: { migrate: { condition: service_completed_successfully } }

  forward:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment:
      <<: *backend_env
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://autotrader_worker:${AUTOTRADER_WORKER_DB_PASSWORD:-worker-local-only}@db:5432/${POSTGRES_DB:-autotrader}
    # Phase 2.5: records frozen strategies' decisions as 30m bars close (PAPER, no orders).
    # Tests are frozen once with: docker compose run --rm forward autotrader forward freeze
    command: ["autotrader", "forward", "run"]
    restart: unless-stopped
    depends_on: { migrate: { condition: service_completed_successfully } }

  paper-trader:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment:
      <<: *backend_env
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://autotrader_worker:${AUTOTRADER_WORKER_DB_PASSWORD:-worker-local-only}@db:5432/${POSTGRES_DB:-autotrader}
    # Phase 3: virtual (PAPER) execution on the live public order book. One instance per
    # database (advisory lock). It starts in the state it was left in; a RUNNING bot
    # re-runs its pre-flight checks before trading again. No exchange endpoint exists.
    # Create the account once: docker compose run --rm paper-trader autotrader paper init
    command: ["autotrader", "paper", "run"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on: { migrate: { condition: service_completed_successfully } }

  control:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    environment:
      <<: *backend_env
      AUTOTRADER_DATABASE_URL: postgresql+psycopg://autotrader_control:${AUTOTRADER_CONTROL_DB_PASSWORD:-control-local-only}@db:5432/${POSTGRES_DB:-autotrader}
      # HMAC key for CSRF tokens: >= 32 random characters, never a hex wallet-like string.
      AUTOTRADER_CONTROL_SECRET: ${AUTOTRADER_CONTROL_SECRET:?set AUTOTRADER_CONTROL_SECRET (see .env.example)}
      AUTOTRADER_COOKIE_SECURE: ${AUTOTRADER_COOKIE_SECURE:-true}
      AUTOTRADER_CORS_ORIGINS: ${AUTOTRADER_PUBLIC_ORIGINS:-http://localhost:3000}
    # Authenticated owner commands (start / stop / kill ...). Reached only through the
    # web server (server-side proxy); never published on the host.
    command: ["uvicorn", "autotrader.control.main:app", "--host", "0.0.0.0", "--port", "8001",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    expose: ["8001"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/control/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_BASE_URL: http://api:8000
      CONTROL_BASE_URL: http://control:8001
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      control: { condition: service_healthy }

volumes:
  pgdata:
